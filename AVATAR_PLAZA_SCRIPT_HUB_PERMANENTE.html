let manifest=null, currentVersion=null, timer=null, isRemote=false;
const $=id=>document.getElementById(id);

function toast(t){const z=$("toast");z.textContent=t;z.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>z.style.display="none",1500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function getText(path){
  if(!isRemote && FALLBACK_SCRIPTS[path]!=null) return FALLBACK_SCRIPTS[path];
  const r=await fetch(`${RAW}/${path}?t=${Date.now()}`,{cache:"no-store"});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return await r.text();
}
async function loadManifest(){
  try{
    const r=await fetch(`${RAW}/manifest.json?t=${Date.now()}`,{cache:"no-store"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const m=await r.json(); manifest=m; isRemote=true;
    localStorage.setItem("ap_manifest_cache",JSON.stringify(m));
    $("net").innerHTML='<span class="online">ONLINE • sincronizado</span>';
  }catch(e){
    const cached=localStorage.getItem("ap_manifest_cache");
    if(cached){try{manifest=JSON.parse(cached);isRemote=true;$("net").innerHTML='<span class="offline">CACHE • GitHub indisponível</span>'}catch(_e){manifest=FALLBACK_MANIFEST;isRemote=false}}
    else{manifest=FALLBACK_MANIFEST;isRemote=false;$("net").innerHTML='<span class="offline">OFFLINE • usando V36A embutida</span>'}
  }
  renderVersions(); detectNew();
}
function installed(){return localStorage.getItem("ap_installed_version")||""}
function detectNew(){
  if(!manifest) return;
  const latest=manifest.latest||"";
  const seen=localStorage.getItem("ap_seen_latest")||"";
  const inst=installed();
  if(latest && latest!==inst && latest!==seen){
    const v=(manifest.versions||[]).find(x=>x.id===latest);
    $("banner").style.display="block";
    $("bannerTitle").textContent=`NOVA VERSÃO ${latest}`;
    $("bannerText").textContent=v?`${v.title} — ${v.summary||""}`:"Atualização disponível";
  } else $("banner").style.display="none";
}
function renderVersions(){
  const box=$("versions"); box.innerHTML="";
  const arr=[...(manifest?.versions||[])].reverse();
  if(!arr.length){box.innerHTML='<div class="empty">Nenhuma versão.</div>';return}
  for(const v of arr){
    const c=document.createElement("div");c.className="card";
    const isLatest=v.id===manifest.latest, isInst=v.id===installed();
    c.innerHTML=`<div><span class="tag ${isLatest?"newtag":""}">${isLatest?"MAIS RECENTE":"VERSÃO"}</span>${isInst?'<span class="tag">INSTALADA</span>':""}</div>
    <h2>${esc(v.id)} — ${esc(v.title)}</h2>
    <div class="meta">${esc(v.date||"")}</div>
    <p>${esc(v.summary||"")}</p>
    <div class="meta">${(v.scripts||[]).length} script(s)</div>
    <div style="margin-top:10px"><button class="btn purple">ABRIR VERSÃO</button></div>`;
    c.querySelector("button").onclick=()=>openVersion(v.id);
    box.appendChild(c);
  }
}
async function openVersion(id){
  const v=(manifest?.versions||[]).find(x=>x.id===id); if(!v)return;
  currentVersion=v; localStorage.setItem("ap_seen_latest",manifest.latest||"");
  $("versionTitle").textContent=`${v.id} — ${v.title}`;
  $("versionStatus").textContent=v.id===installed()?"INSTALADA":"NÃO MARCADA";
  $("overlay").style.display="block"; document.body.style.overflow="hidden";
  const out=$("versionContent");
  out.innerHTML=`<div class="card"><b>${esc(v.summary||"")}</b><div class="meta" style="margin-top:6px">${esc(v.install_note||"")}</div></div><div id="scriptsLoad" class="empty">Carregando scripts…</div>`;
  const holder=document.createElement("div");
  try{
    for(const s of (v.scripts||[])){
      const code=await getText(s.path);
      const lines=code.replace(/\n$/,"").split("\n");
      const partCount=Math.max(1,Math.min(6,Number(s.parts||2)));
      const parts=[];
      for(let i=0;i<partCount;i++){
        const a=Math.floor(lines.length*i/partCount);
        const b=Math.floor(lines.length*(i+1)/partCount);
        parts.push(lines.slice(a,b).join("\n"));
      }
      const hideFull=s.hide_full===true;
      const sec=document.createElement("section");sec.className="script";
      let fullHtml="";
      if(!hideFull){
        fullHtml=`<div style="margin:8px 0">
         <button class="btn green all">COPIAR SCRIPT INTEIRO</button>
         <button class="btn manual">SELECIONAR INTEIRO</button>
        </div><textarea class="allcode" readonly></textarea>`;
      }else{
        fullHtml=`<div class="empty" style="margin:8px 0">
        SCRIPT INTEIRO OCULTO POR SEGURANÇA • COLE AS ${partCount} PARTES EM ORDEM
        </div>`;
      }
      let details="";
      for(let i=0;i<partCount;i++){
        const last=(parts[i].split("\n").filter(Boolean).pop()||"");
        details+=`<details><summary>PARTE ${i+1}/${partCount}</summary>
        <button class="btn purple part" data-i="${i}">COPIAR PARTE ${i+1}</button>
        <div class="meta">Última linha: ${esc(last.slice(0,140))}</div>
        <textarea class="partarea" data-i="${i}" readonly></textarea></details>`;
      }
      sec.innerHTML=`<h3>${esc(s.name)}</h3>
      <div class="meta"><b>${esc(s.type||"Script")}</b> • ${esc(s.location||"")} • ${lines.length} linhas</div>
      <div class="hash">SHA-256 esperado: ${esc(s.sha256||"")}</div>
      ${fullHtml}${details}`;
      if(!hideFull){
        sec.querySelector(".allcode").value=code;
        sec.querySelector(".all").onclick=()=>copyText(code,"SCRIPT INTEIRO COPIADO");
        sec.querySelector(".manual").onclick=()=>selectArea(sec.querySelector(".allcode"));
      }
      sec.querySelectorAll(".partarea").forEach((a,i)=>a.value=parts[i]);
      sec.querySelectorAll(".part").forEach((b,i)=>b.onclick=()=>copyText(parts[i],`PARTE ${i+1} COPIADA`));
      holder.appendChild(sec);
    }
    $("scriptsLoad")?.remove(); out.appendChild(holder);
  }catch(e){
    $("scriptsLoad").textContent="Falha ao carregar scripts: "+e.message;
  }
  detectNew(); renderVersions();
}
function closeVersion(){$("overlay").style.display="none";document.body.style.overflow="";currentVersion=null}
function openLatest(){if(manifest?.latest)openVersion(manifest.latest)}
function markInstalled(){
  if(!currentVersion)return;
  localStorage.setItem("ap_installed_version",currentVersion.id);
  $("versionStatus").textContent="INSTALADA";toast("VERSÃO MARCADA COMO INSTALADA");renderVersions();detectNew();
}
async function copyText(text,msg){
  let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}
  if(!ok){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.left="-9999px";document.body.appendChild(t);t.focus();t.select();try{ok=document.execCommand("copy")}catch(e){}t.remove()}
  toast(ok?msg:"Use SELECIONAR e copie manualmente");
}
function selectArea(a){a.focus();a.select();a.setSelectionRange(0,a.value.length);toast("SELECIONADO PARA CÓPIA MANUAL")}
async function checkNow(){await loadManifest();toast(isRemote?"ATUALIZADO":"SEM CONEXÃO COM O REPO")}
function schedule(){
  if(timer)clearInterval(timer);
  if($("auto").checked)timer=setInterval(()=>loadManifest(),Math.max(5,manifest?.poll_seconds||5)*1000);
}
$("auto").addEventListener("change",schedule);
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeVersion()});
loadManifest().then(schedule);
</script>
